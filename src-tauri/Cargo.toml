[package]
name = "localtex"
version = "0.1.0"
description = "A local LaTeX writing studio"
authors = ["localTEX contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "localtex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
notify = "8"
localtex-core = { path = "../crates/localtex-core" }

[target.'cfg(windows)'.dependencies]
# Already part of the build through Tauri's WebView2 bindings; used for spell checking.
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com"] }
